name: INTENTRA Community staging package

on:
  push:
    branches:
      - feature/comunitate-mvp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-community-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DEV branch
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: comunitate/package-lock.json
      - name: Install pinned dependencies
        working-directory: comunitate
        run: npm ci
      - name: Run application and configuration tests
        working-directory: comunitate
        run: npm test
      - name: Assemble staging artifact without production credentials
        run: node comunitate/scripts/assemble-site.mjs
      - name: Verify compiled /comunitate route
        run: |
          test -s site-release/index.html
          test -s site-release/comunitate/index.html
          test -d site-release/comunitate/assets
          ! grep -q 'https://wnmtrkheznrhrtpbenxh.supabase.co' site-release/comunitate/index.html
      - name: Upload staging artifact (NOT deployed)
        uses: actions/upload-artifact@v4
        with:
          name: intentra-community-staging-site
          path: site-release/
          if-no-files-found: error
          retention-days: 7
