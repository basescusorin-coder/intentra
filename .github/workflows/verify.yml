name: Verify INTENTRA JavaScript
on:
  push:
    paths:
      - index.html
      - favicon.ico
      - favicon-*.png
      - apple-touch-icon.png
      - tests/**
      - .github/workflows/verify.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests
        run: node --test tests/*.test.js
      - name: Check HTML structure and JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html','utf8');
          const script = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!script) throw new Error('Inline JavaScript missing');
          new vm.Script(script[1]);
          for (const id of ['query','search','categories','results','cards','requirements']) {
            if (!html.includes('id="'+id+'"')) throw new Error('Missing element: '+id);
          }
          for (const lang of ['ro','de','en']) {
            if (!html.includes('data-lang="'+lang+'"')) throw new Error('Missing language: '+lang);
          }
          for (const cat of ['auto','housing','hotels','jobs','products','insurance']) {
            if (!html.includes(cat+':[')) throw new Error('Missing source category: '+cat);
          }
          console.log('PASS: JavaScript parses; essential UI, languages and categories present.');
          NODE
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test page interactions in Chromium
        run: |
          node - <<'NODE'
          const {chromium}=require('playwright');
          const http=require('node:http');
          const fs=require('node:fs');
          (async()=>{
            const server=http.createServer((req,res)=>{const pathname=new URL(req.url,'http://localhost').pathname;const filename=pathname==='/'?'index.html':pathname.slice(1);if(!['index.html','favicon.png','favicon.ico','favicon-48.png','favicon-96.png','favicon-192.png','apple-touch-icon.png','intentra-logo.png'].includes(filename)&&!/^assets\/(auto|housing|hotels|jobs|products|swiss)\.webp$/.test(filename)){res.statusCode=404;return res.end()}res.setHeader('Content-Type',filename.endsWith('.png')?'image/png':filename.endsWith('.ico')?'image/x-icon':filename.endsWith('.webp')?'image/webp':'text/html; charset=utf-8');res.end(fs.readFileSync(filename))});
            await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',msg=>console.log('BROWSER:',msg.type(),msg.text()));
            await page.goto('http://127.0.0.1:'+server.address().port+'/');
            for(const icon of ['favicon.ico','favicon-48.png','favicon-96.png','favicon-192.png','apple-touch-icon.png']){
              const response=await page.request.get('http://127.0.0.1:'+server.address().port+'/'+icon);
              if(!response.ok()) throw Error(icon+' returned HTTP '+response.status());
            }
            console.log('Loaded app and favicon assets over HTTP');
            for(const lang of ['ro','de','en']){
              await page.locator('[data-lang="'+lang+'"]').click();
              console.log('Language switched:',lang);
              if(await page.locator('html').getAttribute('lang')!==lang) throw Error('Language failed: '+lang);
              if(!(await page.locator('#headline').innerText()).trim()) throw Error('Heading missing: '+lang);
            }
            await page.locator('[data-lang="ro"]').click();
            await page.locator('#query').fill('Caut un Mercedes sub 10000 CHF în Elveția');
            await page.locator('#search').click();
            console.log('Car search submitted');
            if(await page.locator('#results').isHidden()) throw Error('Results not shown');
            if(await page.locator('#cards a').count()!==3) throw Error('Missing search links');
            if(!(await page.locator('#requirements').innerText()).includes('10000')) throw Error('Budget parsing failed: '+await page.locator('#requirements').innerText());
            const url=new URL(await page.locator('#cards a').first().getAttribute('href'));
            if(url.hostname!=='www.autoscout24.ch'||url.pathname!=='/de/s') throw Error('Car result does not link directly to AutoScout24');
            if(!(await page.locator('#resultsSubtitle').innerText()).includes('Mercedes')) throw Error('Search text missing from guidance');
            if(!(await page.locator('#copyQuery').innerText()).includes('Copiază cererea')) throw Error('Copy request control missing');
            await page.locator('#query').fill('Caut hotel în Zürich');
            await page.locator('#search').click();
            console.log('Hotel search submitted');
            if(!(await page.locator('#cards').innerText()).includes('Booking.com')) throw Error('Hotel category detection failed');
            if(await page.locator('#exploreCards button').count()!==6) throw Error('Missing visual categories');
            await page.locator('#exploreCards button').filter({hasText:'Joburi'}).click();
            await page.locator('#search').click();
            if(!(await page.locator('#cards').innerText()).includes('jobs.ch')) throw Error('Visual job category failed');
            await page.locator('#exploreCards button').filter({hasText:'Asigurări'}).click();
            await page.locator('#search').click();
            if(await page.locator('#cards a').count()!==5) throw Error('Insurance category should expose five subcategories');
            const insuranceLinks=await page.locator('#cards a').evaluateAll(links=>links.map(a=>a.href));
            if(insuranceLinks[0]!=='https://www.priminfo.admin.ch/de/praemien/') throw Error('Mandatory health insurance must link to official Priminfo');
            if(insuranceLinks.some(url=>!url.startsWith('https://'))) throw Error('Insurance links must use HTTPS');
            if(!(await page.locator('#cards').innerText()).includes('Răspundere civilă privată')) throw Error('Liability insurance subcategory missing');
            if(!(await page.locator('#notice').innerText()).includes('nu este broker')) throw Error('Insurance broker disclaimer missing');
            await page.locator('#query').fill('apartament în Zürich');
            await page.locator('#autoCategory').click();
            await page.locator('#search').click();
            if(!(await page.locator('#cards').innerText()).includes('Homegate')) throw Error('Automatic category reset failed');
            for(const width of [390,320,768,1440]){
              await page.setViewportSize({width,height:900});
              for(const lang of ['ro','de','en']){
                await page.locator('[data-lang="'+lang+'"]').click();
                if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1)){console.log(await page.evaluate(()=>[...document.querySelectorAll('body *')].filter(e=>{const r=e.getBoundingClientRect();return r.width&&r.right>innerWidth+1}).map(e=>({tag:e.tagName,class:e.className,right:e.getBoundingClientRect().right,text:e.textContent.slice(0,60)}))));await page.screenshot({path:'intentra-overflow.png',fullPage:true});throw Error('Horizontal overflow at '+width+' '+lang)}
                if(!await page.locator('#search').isVisible()) throw Error('Search hidden at '+width);
                await page.locator('#examples button').first().click();
                if(await page.locator('#cards a').count()!==3) throw Error('Example search failed at '+width+' '+lang);
              }
            }
            await page.setViewportSize({width:390,height:844});
            await page.locator('[data-lang="ro"]').click();
            await page.reload();
            await page.locator('.category-photo').evaluateAll(async images=>{await Promise.all(images.map(i=>i.decode()));if(images.length!==6||images.some(i=>!i.naturalWidth))throw Error('Missing category photography')});
            await page.screenshot({path:'intentra-mobile.png',fullPage:true});
            await page.setViewportSize({width:1440,height:1000});
            await page.screenshot({path:'intentra-desktop.png',fullPage:true});
            if(errors.length) throw Error('JavaScript errors: '+errors.join('; '));
            console.log('PASS: language switching, car and hotel searches, budget parsing, external links, no JS exceptions');
            await browser.close();
            await new Promise(resolve=>server.close(resolve));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Save design previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intentra-design-previews
          path: intentra-*.png

  public_site:
    name: Test deployed public GitHub Pages site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify delivered HTML and live language switching
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          const SITE_URL='https://intentra.ch/';
          (async () => {
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage();
              const errors=[];
              page.on('pageerror',err=>errors.push(err.message));
              const response=await page.goto(SITE_URL+'?livecheck='+Date.now(),{waitUntil:'networkidle',timeout:45000});
              if(!response||response.status()!==200) throw Error('Public page returned HTTP '+(response?.status()??'no response'));
              const html=await page.content();
              for(const lang of ['ro','de','en']) {
                if(!html.includes('data-lang="'+lang+'"')) throw Error('Missing '+lang+' in publicly delivered HTML');
              }
              if(!html.includes('<script>')) throw Error('No JavaScript in publicly delivered HTML');
              const sitemapResponse=await page.request.get(SITE_URL+'sitemap.xml');
              if(!sitemapResponse.ok()) throw Error('sitemap.xml returned HTTP '+sitemapResponse.status());
              if(!(await sitemapResponse.text()).includes('https://intentra.ch/')) throw Error('sitemap does not list the canonical domain');
              console.log('PUBLIC SITEMAP OK:',sitemapResponse.status());
              for(const icon of ['favicon.ico','favicon-48.png','favicon-96.png','favicon-192.png','apple-touch-icon.png']) {
                const iconResponse=await page.request.get(SITE_URL+icon);
                if(!iconResponse.ok()) throw Error(icon+' returned HTTP '+iconResponse.status());
                console.log('PUBLIC ICON OK:',icon,iconResponse.status());
              }
              const headings=[];
              for(const lang of ['ro','de','en']){
                const btn=page.locator('[data-lang="'+lang+'"]');
                if(await btn.count()!==1) throw Error('Public selector '+lang+' not visible exactly once');
                if(!await btn.isVisible()) throw Error('Public selector '+lang+' is hidden');
                await btn.click();
                if(await page.locator('html').getAttribute('lang')!==lang) throw Error('Language switching failed: '+lang);
                if(await btn.getAttribute('aria-pressed')!=='true') throw Error('Selected language not active: '+lang);
                const headline=(await page.locator('#headline').innerText()).trim();
                if(!headline) throw Error('Empty headline for '+lang);
                headings.push(headline);
                console.log('PUBLIC '+lang+' OK:',headline);
              }
              if(new Set(headings).size!==3) throw Error('Headline not translated across three languages');
              await page.locator('[data-lang="ro"]').click();
              await page.locator('#exploreCards button').filter({hasText:'Asigurări'}).click();
              await page.locator('#search').click();
              const insuranceLinks=await page.locator('#cards a').evaluateAll(links=>links.map(a=>a.href));
              if(insuranceLinks.length!==5||insuranceLinks[0]!=='https://www.priminfo.admin.ch/de/praemien/') throw Error('Public insurance subcategory links failed');
              if(insuranceLinks.some(url=>!url.startsWith('https://'))) throw Error('Public insurance link is not HTTPS');
              const insuranceResponses=await Promise.all(insuranceLinks.map(url=>page.request.get(url,{timeout:30000})));
              if(insuranceResponses.some(response=>response.status()===404)) throw Error('An insurance source URL returned HTTP 404: '+insuranceResponses.map(r=>r.status()).join(','));
              console.log('PUBLIC INSURANCE LINKS OK:',insuranceResponses.map(r=>r.status()).join(','));
              console.log('PUBLIC insurance OK:',insuranceLinks.length,'sources including official Priminfo');
              if(errors.length) throw Error('Public page JavaScript exceptions: '+errors.join('; '));
              console.log('PASS PUBLIC SITE:',SITE_URL,'HTTP 200; delivered HTML; RO/DE/EN selector; real switching; no JS exceptions');
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
