name: Comunitate DEV checks (no deployment)

on:
  push:
    branches:
      - feature/comunitate-mvp
    paths:
      - 'comunitate/**'
      - '.github/workflows/comunitate-dev-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comunitate-dev-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/feature/comunitate-mvp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: comunitate
    steps:
      - name: Checkout DEV branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: comunitate/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Validate inputs
        run: npm test
      - name: Check RLS in local WASM harness
        run: npm run test:rls:wasm
      - name: Check Edge Functions types
        run: npm run test:edge
      - name: Build DEV app
        run: npm run build
      - name: Package desktop preview (not public)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: intentra-comunitate-dev-preview
          path: comunitate/dist/
          if-no-files-found: error
          retention-days: 7
