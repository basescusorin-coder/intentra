<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTENTRA — AI Intent Verification</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background: radial-gradient(circle at top, #142743, #070d19 45%, #020610);
}

.container {
  width: min(900px, 92%);
  margin: auto;
  padding: 50px 0;
}

h1 {
  text-align: center;
  font-size: 42px;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #8beeff;
  margin-bottom: 35px;
}

.card {
  background: rgba(15, 45, 80, .65);
  border: 1px solid #168cb0;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 18px;
}

label {
  display: block;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 10px;
}

textarea {
  width: 100%;
  min-height: 130px;
  padding: 15px;
  resize: vertical;
  border-radius: 12px;
  border: 1px solid #25cbea;
  background: #09172a;
  color: white;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 17px;
  border: 0;
  border-radius: 12px;
  background: #53e5e7;
  color: #06131c;
  font-weight: bold;
  font-size: 17px;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

#result {
  display: none;
  margin-top: 22px;
  padding: 22px;
  border-radius: 16px;
  background: #0a192b;
  border: 1px solid #28c9e8;
}

#verdict {
  font-size: 25px;
  font-weight: bold;
}

#score {
  margin-top: 8px;
  font-size: 20px;
}

#error {
  color: #ff8b8b;
}

footer {
  text-align: center;
  margin-top: 25px;
  color: #8ba1b8;
}
</style>
</head>

<body>

<div class="container">

  <h1>INTENTRA</h1>
  <div class="subtitle">AI Intent Verification Platform</div>

  <div class="card">
    <label for="userRequest">1. User Request</label>
    <textarea id="userRequest"
      placeholder="Enter the original instruction given to the AI agent."></textarea>
  </div>

  <div class="card">
    <label for="aiResult">2. AI Result</label>
    <textarea id="aiResult"
      placeholder="Paste the result produced by the AI agent."></textarea>
  </div>

  <button id="verifyButton" onclick="verifyIntent()">
    VERIFY INTENT
  </button>

  <div id="result">
    <div id="verdict"></div>
    <div id="score"></div>
    <p id="summary"></p>

    <div id="violationsBox">
      <strong>Critical violations</strong>
      <ul id="violations"></ul>
    </div>

    <div id="error"></div>
  </div>

  <footer>INTENTRA · Verify the intent, not just the output.</footer>

</div>

<script>
const WORKER_URL =
  "https://intentra-ai.basescusorin.workers.dev/";

async function verifyIntent() {

  const userRequest =
    document.getElementById("userRequest").value.trim();

  const aiResult =
    document.getElementById("aiResult").value.trim();

  const button =
    document.getElementById("verifyButton");

  const result =
    document.getElementById("result");

  const error =
    document.getElementById("error");

  if (!userRequest || !aiResult) {
    alert("Please complete both fields.");
    return;
  }

  result.style.display = "block";
  error.textContent = "";

  button.disabled = true;
  button.textContent = "VERIFYING...";

  try {

    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        userRequest: userRequest,
        aiResult: aiResult
      })
    });

    const data = await response.json();

    if (!response.ok || !data.ok) {
      throw new Error(
        data.details || data.error || "Verification failed"
      );
    }

    const v = data.verification;

    document.getElementById("verdict").textContent =
      v.verdict === "fulfilled"
        ? "✅ Intent fulfilled"
        : v.verdict === "partial"
        ? "⚠️ Intent partially fulfilled"
        : "❌ Intent not fulfilled";

    document.getElementById("score").textContent =
      "Intent score: " + v.score + "%";

    document.getElementById("summary").textContent =
      v.summary || "";

    const list =
      document.getElementById("violations");

    list.innerHTML = "";

    const violations =
      Array.isArray(v.critical_violations)
        ? v.critical_violations
        : [];

    document.getElementById("violationsBox").style.display =
      violations.length ? "block" : "none";

    violations.forEach(function(item) {
      const li = document.createElement("li");
      li.textContent = item;
      list.appendChild(li);
    });

  } catch (err) {

    document.getElementById("verdict").textContent =
      "Verification error";

    document.getElementById("score").textContent = "";
    document.getElementById("summary").textContent = "";
    document.getElementById("violations").innerHTML = "";

    error.textContent = err.message;

  } finally {

    button.disabled = false;
    button.textContent = "VERIFY INTENT";

  }
}
</script>

</body>
</html>
