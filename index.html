<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="INTENTRA: descrie ce cauți și explorează surse relevante pentru mașini, locuințe, joburi și produse.">
<meta name="google-site-verification" content="2KI8H6tvn0gXqwWRWvHc2bvzbMq9MAxwfb5Mwc7Cvuc">
<link rel="canonical" href="https://basescusorin-coder.github.io/intentra/">
<title>INTENTRA — Tu spui ce cauți</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,sans-serif;background:#050b1b;color:#f1f7ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#153c83 0,transparent 60%),#050b1b;min-height:100vh}
main{max-width:1020px;margin:auto;padding:24px 20px 65px}header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{font-size:23px;letter-spacing:.13em;font-weight:850;color:white;text-decoration:none}.brand b{color:#55d7ff}
.languages{display:flex;gap:7px}.languages button,.categories button{background:#102448;color:#d7e8ff;border:1px solid #355c8b;border-radius:10px;padding:9px 12px;cursor:pointer}
.languages button[aria-pressed=true],.categories button[aria-pressed=true]{background:#4bd3ff;color:#031427;border-color:#4bd3ff;font-weight:800}
.hero{padding:80px 0 32px;max-width:830px}.eyebrow{color:#73dfff;font-size:12px;letter-spacing:.17em;font-weight:800;text-transform:uppercase}
h1{font-size:clamp(38px,7vw,72px);line-height:1.04;letter-spacing:-.055em;margin:16px 0}h1 em{color:#55d7ff;font-style:normal}
.hero p{font-size:clamp(16px,2vw,19px);color:#c2d5f1;max-width:750px}
.panel{background:linear-gradient(140deg,#0b2657,#0a1732);border:1px solid #345f98;border-radius:22px;padding:24px;box-shadow:0 18px 65px #0005}
label{display:block;font-weight:750;margin-bottom:12px}textarea{width:100%;resize:vertical;min-height:120px;background:#06152f;color:white;border:1px solid #4474b1;border-radius:12px;padding:17px;font:inherit;font-size:17px}
textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid #63ddff;outline-offset:3px}
.categories{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.primary{border:0;background:linear-gradient(110deg,#31c9ff,#7ce9ff);color:#04152c;font-weight:850;border-radius:12px;padding:15px 25px;cursor:pointer;font:inherit;font-weight:800}
.muted{color:#afc2de;font-size:13px}.error{color:#ffb6bd;min-height:20px}
.results{margin-top:28px}.results h2{font-size:25px}.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:13px}
.result-card{border:1px solid #315786;border-radius:16px;padding:20px;background:#0d2145}
.result-card h3{margin:0 0 8px;font-size:18px}.result-card p{color:#b9cde7;font-size:14px;min-height:60px}
.result-card a{display:inline-block;color:#04152c;background:#71dcff;text-decoration:none;padding:10px 13px;border-radius:9px;font-weight:800}
.notice{margin-top:22px;padding:15px;border:1px solid #536687;border-radius:12px;background:#10203b;color:#d0dced;font-size:14px}
.req-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.req-tag{border:1px solid #527cae;border-radius:20px;padding:5px 10px;color:#e4f3ff;background:#16355e;font-size:13px}footer{margin-top:42px;color:#8da7c7;text-align:center;font-size:12px}
@media(max-width:600px){main{padding:20px 14px 40px}.hero{padding:45px 0 20px}.panel{padding:15px}.actions .primary{width:100%}}
</style></head>
<body><main>
<header><a class="brand" href="./">✓ INTENTRA<b>.</b></a><nav class="languages" aria-label="Language"><button type="button" data-lang="ro">🇷🇴 RO</button><button type="button" data-lang="de">🇩🇪 DE</button><button type="button" data-lang="en">🇬🇧 EN</button></nav></header>
<section class="hero"><div class="eyebrow" id="eyebrow"></div><h1 id="headline"></h1><p id="intro"></p></section>
<section class="panel"><label for="query" id="queryLabel"></label><textarea id="query" maxlength="2000"></textarea>
<div class="categories" id="categories"></div><div class="actions"><button type="button" class="primary" id="search"></button><span class="muted" id="helper"></span></div><p class="error" id="error" role="alert"></p></section>
<section class="results" id="results" hidden aria-live="polite"><div class="notice" id="requirements" style="margin-bottom:16px"></div><h2 id="resultsTitle"></h2><p class="muted" id="resultsSubtitle"></p><div class="result-grid" id="cards"></div><div class="notice" id="notice"></div></section>
<footer id="footer"></footer>
</main>
<script>
(()=>{
const i18n={
ro:{eyebrow:"Căutare simplă • surse relevante",headline:"Tu spui ce cauți.<br><em>Noi te ajutăm să găsești.</em>",intro:"Mașini, locuințe, locuri de muncă și produse. Descrie ce îți trebuie și pornește căutarea pe platforme relevante.",queryLabel:"Ce cauți?",placeholder:"Exemplu: Mercedes E-Class din 2020, sub 20.000 CHF, în Elveția",search:"Caută variante",helper:"Fără cont. Fără oferte inventate.",error:"Scrie ce cauți înainte să pornești căutarea.",resultsTitle:"Unde poți găsi variante",resultsSubtitle:"Am pregătit căutări pe platforme externe. Deschide sursele pentru anunțuri și prețuri actuale.",notice:"Important: INTENTRA nu preia încă automat ofertele și nu le verifică disponibilitatea. Linkurile deschid căutări pe site-uri terțe. Compară prețul, locația și condițiile înainte să decizi.",footer:"INTENTRA • Căutare orientată spre cerințele tale • Versiune inițială",categories:["Auto","Locuințe","Joburi","Produse"],open:"Deschide căutarea",requirements:"Cerințe identificate din text (nu sunt încă verificate în anunțuri)",none:"Nu am identificat automat condiții precise. Căutarea folosește textul complet.",budget:"Buget",year:"An minim",place:"Locație",count:"Număr de variante",terms:"Cuvinte importante",descriptions:["Caută anunțuri auto pe această platformă.","Explorează anunțuri imobiliare.","Descoperă posturi disponibile.","Compară produse și magazine."]},
de:{eyebrow:"Einfach suchen • relevante Quellen",headline:"Sag, was du suchst.<br><em>Wir helfen dir dabei.</em>",intro:"Autos, Wohnungen, Jobs und Produkte. Beschreibe deinen Wunsch und suche auf passenden Plattformen.",queryLabel:"Was suchst du?",placeholder:"Beispiel: Mercedes E-Klasse ab 2020, unter 20.000 CHF, Schweiz",search:"Angebote suchen",helper:"Ohne Konto. Keine erfundenen Angebote.",error:"Bitte beschreibe zuerst, was du suchst.",resultsTitle:"Hier findest du Angebote",resultsSubtitle:"Wir haben externe Suchlinks vorbereitet. Öffne die Quellen für aktuelle Angebote und Preise.",notice:"Wichtig: INTENTRA ruft Angebote noch nicht automatisch ab und prüft deren Verfügbarkeit nicht. Die Links führen zu externen Websites. Prüfe Preise, Standort und Bedingungen.",footer:"INTENTRA • Suche nach deinen Vorgaben • Erste Version",categories:["Autos","Wohnen","Jobs","Produkte"],open:"Suche öffnen",requirements:"Erkannte Anforderungen (noch nicht anhand von Anzeigen geprüft)",none:"Keine eindeutigen Bedingungen erkannt. Die Suche verwendet den vollständigen Text.",budget:"Budget",year:"Mindestjahr",place:"Ort",count:"Anzahl",terms:"Wichtige Wörter",descriptions:["Autoanzeigen auf dieser Plattform suchen.","Immobilienangebote entdecken.","Offene Stellen finden.","Produkte und Shops vergleichen."]},
en:{eyebrow:"Simple search • relevant sources",headline:"Tell us what you need.<br><em>We'll help you find it.</em>",intro:"Cars, homes, jobs and products. Describe what you need and search relevant platforms.",queryLabel:"What are you looking for?",placeholder:"Example: Mercedes E-Class from 2020, under CHF 20,000, Switzerland",search:"Find options",helper:"No account. No invented listings.",error:"Describe what you need before searching.",resultsTitle:"Where to find options",resultsSubtitle:"We've prepared external searches. Open the sources for current listings and prices.",notice:"Important: INTENTRA does not yet retrieve listings automatically or verify availability. Links open third-party websites. Check prices, location and terms before deciding.",footer:"INTENTRA • Search based on your requirements • Initial version",categories:["Cars","Housing","Jobs","Products"],open:"Open search",requirements:"Requirements detected (not yet verified against listings)",none:"No precise constraints detected. The full text is used for searching.",budget:"Budget",year:"Minimum year",place:"Location",count:"Number of options",terms:"Important words",descriptions:["Find car listings on this platform.","Explore property listings.","Discover available positions.","Compare products and stores."]}
};
const sources={
auto:[["AutoScout24","https://www.google.com/search?q="+encodeURIComponent("site:autoscout24.ch ")],["Car For You","https://www.google.com/search?q="+encodeURIComponent("site:carforyou.ch ")],["tutti.ch","https://www.google.com/search?q="+encodeURIComponent("site:tutti.ch Auto ")]],
housing:[["Homegate","https://www.google.com/search?q="+encodeURIComponent("site:homegate.ch ")],["ImmoScout24","https://www.google.com/search?q="+encodeURIComponent("site:immoscout24.ch ")],["Flatfox","https://www.google.com/search?q="+encodeURIComponent("site:flatfox.ch ")]],
jobs:[["jobs.ch","https://www.google.com/search?q="+encodeURIComponent("site:jobs.ch ")],["JobScout24","https://www.google.com/search?q="+encodeURIComponent("site:jobscout24.ch ")],["Indeed","https://www.google.com/search?q="+encodeURIComponent("site:ch.indeed.com ")]],
products:[["Galaxus","https://www.google.com/search?q="+encodeURIComponent("site:galaxus.ch ")],["Digitec","https://www.google.com/search?q="+encodeURIComponent("site:digitec.ch ")],["Toppreise","https://www.google.com/search?q="+encodeURIComponent("site:toppreise.ch ")]]
};
const keys=["auto","housing","jobs","products"];
let lang="ro",category="auto",searched=false,categoryChosen=false;
try{const saved=localStorage.getItem("intentra-lang");if(i18n[saved])lang=saved}catch(e){}
const $=id=>document.getElementById(id);
function render(){
const t=i18n[lang];document.documentElement.lang=lang;
$("eyebrow").textContent=t.eyebrow;$("headline").innerHTML=t.headline;$("intro").textContent=t.intro;
$("queryLabel").textContent=t.queryLabel;$("query").placeholder=t.placeholder;$("search").textContent=t.search;
$("helper").textContent=t.helper;$("footer").textContent=t.footer;$("resultsTitle").textContent=t.resultsTitle;
$("resultsSubtitle").textContent=t.resultsSubtitle;$("notice").textContent=t.notice;
document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
$("categories").replaceChildren();
keys.forEach((k,index)=>{const b=document.createElement("button");b.type="button";b.textContent=t.categories[index];b.setAttribute("aria-pressed",String(category===k));b.addEventListener("click",()=>{category=k;categoryChosen=true;render();if(searched)showResults()});$("categories").appendChild(b)});
if(searched)showResults();
}
function extractRequirements(q){
const found=[];
const money=q.match(/(?:sub|under|max(?:imum)?|până la|cel mult|unter|bis zu|maximum|buget(?:ul)?(?: de)?|budget(?: of)?)[^\\n,.]{0,30}?(\\d{1,3}(?:[ .']\\d{3})+|\\d{3,6})\\s*(CHF|EUR|€|lei|RON|USD)?|(?:CHF|EUR|€|RON|USD)\\s*(\\d{1,3}(?:[ .']\\d{3})+|\\d{3,6})/i);
if(money){const amount=(money[1]||money[3]||"").replace(/[ .']/g,"");if(amount)found.push(["budget",amount+" "+(money[2]||q.match(/CHF|EUR|RON|USD|€/i)?.[0]||"").toUpperCase()])}
const year=q.match(/(?:din|from|ab|since|după|after|nach|începând cu|mai nou de)\\s*(?:anul\\s*)?(20[0-3]\\d)|(?:20[0-3]\\d)\\s*(?:sau mai nou|or newer|oder neuer)/i);
if(year)found.push(["year",year[1]||year[2]]);
const place=q.match(/(?:în|in|near|lângă|bei|around|zona|region|regiunea)\\s+([A-ZĂÂÎȘȚ][\\p{L}-]+(?:\\s+[A-ZĂÂÎȘȚ][\\p{L}-]+){0,2})/u);
if(place)found.push(["place",place[1]]);
const count=q.match(/(?:exact|exactly|genau|vreau|want|suche|caut)\\s+(\\d{1,2})\\s+(?:mașini|masini|autos|cars|oferte|options|variante|apartamente|wohnungen|jobs|produse|products)/i);
if(count)found.push(["count",count[1]]);
return found;
}
function renderRequirements(q){
const t=i18n[lang],el=$("requirements"),found=extractRequirements(q);
el.replaceChildren();const heading=document.createElement("strong");heading.textContent=t.requirements;el.appendChild(heading);
if(!found.length){const p=document.createElement("p");p.textContent=t.none;el.appendChild(p);return}
const tags=document.createElement("div");tags.className="req-tags";
found.forEach(([type,value])=>{const span=document.createElement("span");span.className="req-tag";span.textContent=t[type]+": "+value;tags.appendChild(span)});el.appendChild(tags);
}
function inferCategory(q){
const t=q.toLocaleLowerCase();
const groups={
housing:["apartament","garsonier","chirie","inchiri","închiri","wohnung","miete","haus","house","rent","flat","studio","imobil","locuin"],
jobs:["job","angaj","serviciu","muncă","munca","arbeit","stelle","employment","vacanc","recrut","salari","salary"],
auto:["mașin","masin","autoturism","automobil","mercedes","bmw","audi","volkswagen","toyota","hyundai","ford","tesla","auto","car ","cars","fahrzeug","occasion"],
products:["televiz","telefon","laptop","frigider","mobil","sofa","canapea","produs","product","handy","smartphone","computer","möbel","tv "]
};
return Object.keys(groups).find(k=>groups[k].some(word=>t.includes(word)))||"products";
}
function showResults(){
const q=$("query").value.trim(),t=i18n[lang];if(!q){$("error").textContent=t.error;$("results").hidden=true;searched=false;return}
$("error").textContent="";$("results").hidden=false;searched=true;if(!categoryChosen){const inferred=inferCategory(q);if(category!==inferred){category=inferred;render();return}}$("cards").replaceChildren();renderRequirements(q);
sources[category].forEach(([name,prefix])=>{const card=document.createElement("article");card.className="result-card";
const h=document.createElement("h3");h.textContent=name;const p=document.createElement("p");p.textContent=t.descriptions[keys.indexOf(category)];
const a=document.createElement("a");a.textContent=t.open;a.href=prefix+encodeURIComponent(q);a.setAttribute("aria-label",t.open+" — "+name);a.target="_blank";a.rel="noopener noreferrer";
card.append(h,p,a);$("cards").appendChild(card)});
}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;try{localStorage.setItem("intentra-lang",lang)}catch(e){}render()}));
$("search").addEventListener("click",showResults);$("query").addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter")showResults()});
render();
})();
</script></body></html>
